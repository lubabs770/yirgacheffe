<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="680" font-family="monospace" font-size="15">
  <rect width="1020" height="680" fill="#fafafa"/>
  <text x="510" y="40" font-size="24" font-weight="bold" text-anchor="middle">Steam cover — OPTION B: motor is DC</text>
  <text x="510" y="66" font-size="14" text-anchor="middle" fill="#555">Relay switches a wall wart's DC. No mains touches the motor at all.</text>
  <text x="510" y="88" font-size="13" text-anchor="middle" fill="#d33">Use this sheet if the AA battery tap gave a KICK or TWITCH.</text>

  <!-- ESP32 -->
  <rect x="50" y="200" width="190" height="210" rx="10" fill="#1b1b1b"/>
  <text x="145" y="232" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">ESP32</text>
  <g fill="#8f8"><circle cx="240" cy="270" r="5"/><circle cx="240" cy="310" r="5"/><circle cx="240" cy="350" r="5"/><circle cx="240" cy="390" r="5"/></g>
  <g fill="#fff" font-size="13" text-anchor="end">
    <text x="228" y="275">5V</text>
    <text x="228" y="315">GPIO32</text>
    <text x="228" y="355">GPIO33</text>
    <text x="228" y="395">GND</text>
  </g>

  <!-- relay module -->
  <rect x="400" y="215" width="250" height="215" rx="10" fill="#eef" stroke="#1a6fd4" stroke-width="2"/>
  <text x="525" y="243" text-anchor="middle" font-weight="bold" font-size="15">5V RELAY (1 ch)</text>
  <text x="525" y="261" text-anchor="middle" font-size="11" fill="#666">opto-isolated · jumper = LOW</text>
  <g font-size="13">
    <text x="412" y="275">VCC</text>
    <text x="412" y="315">IN</text>
    <text x="412" y="395">GND</text>
    <text x="638" y="275" text-anchor="end">COM</text>
    <text x="638" y="335" text-anchor="end">NO</text>
    <text x="638" y="395" text-anchor="end">NC</text>
  </g>
  <g fill="#333"><circle cx="400" cy="270" r="4"/><circle cx="400" cy="310" r="4"/><circle cx="400" cy="390" r="4"/>
                  <circle cx="650" cy="270" r="4"/><circle cx="650" cy="330" r="4"/><circle cx="650" cy="390" r="4"/></g>
  <text x="525" y="415" text-anchor="middle" font-size="11" fill="#888">contacts are isolated — dry contact</text>

  <!-- coil side -->
  <path d="M240 270 H400" stroke="#e8890c" stroke-width="2.5" fill="none"/>
  <text x="300" y="262" fill="#e8890c" font-size="12">5V</text>
  <path d="M240 310 H400" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <text x="290" y="302" fill="#1a6fd4" font-size="12">signal</text>
  <path d="M240 390 H400" stroke="#2e9e4f" stroke-width="2.5" fill="none"/>
  <text x="300" y="382" fill="#2e9e4f" font-size="12">GND</text>

  <!-- limit switch -->
  <rect x="330" y="470" width="270" height="80" rx="8" fill="#fff" stroke="#1a6fd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="465" y="497" text-anchor="middle" font-size="14" font-weight="bold">cover limit switch</text>
  <text x="465" y="517" text-anchor="middle" font-size="12" fill="#555">blue / blue pair</text>
  <text x="465" y="536" text-anchor="middle" font-size="12" fill="#555">one wire → GPIO33 · other → GND</text>
  <path d="M240 350 H300 V510 H330" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <path d="M240 390 H316 V596 H465 V550" stroke="#2e9e4f" stroke-width="2.5" fill="none"/>

  <!-- wall wart -->
  <rect x="700" y="110" width="300" height="86" rx="8" fill="#fff5e6" stroke="#e8890c" stroke-width="2"/>
  <text x="850" y="140" text-anchor="middle" font-size="15" font-weight="bold">DC WALL WART</text>
  <text x="850" y="161" text-anchor="middle" font-size="12" fill="#555">voltage must match the motor</text>
  <text x="850" y="180" text-anchor="middle" font-size="12" fill="#b06000">likely 12V — old board had a 12V rail</text>
  <circle cx="700" cy="140" r="4" fill="#333"/>
  <text x="690" y="144" text-anchor="end" font-size="13" fill="#e8890c">(+)</text>
  <circle cx="965" cy="196" r="4" fill="#333"/>
  <text x="975" y="214" font-size="13" fill="#2e9e4f">(−)</text>

  <!-- wart (+) into COM -->
  <path d="M650 270 H672 V140 H700" stroke="#e8890c" stroke-width="3" fill="none"/>
  <text x="682" y="232" fill="#e8890c" font-size="12">(+) in</text>

  <!-- NO out to motor (+) -->
  <path d="M650 330 H760" stroke="#e8890c" stroke-width="3" fill="none"/>
  <text x="662" y="322" fill="#e8890c" font-size="12">switched</text>

  <!-- NC unused -->
  <path d="M650 390 H676" stroke="#999" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="684" y="394" fill="#999" font-size="12">NC — empty</text>

  <!-- motor -->
  <rect x="760" y="300" width="180" height="100" rx="8" fill="#f7eaff" stroke="#8a3fd1" stroke-width="2"/>
  <text x="850" y="334" text-anchor="middle" font-size="15" font-weight="bold">COVER MOTOR</text>
  <text x="850" y="356" text-anchor="middle" font-size="12" fill="#555">DC · 23.6 Ω</text>
  <text x="850" y="375" text-anchor="middle" font-size="12" fill="#555">red = (+) · black = (−)</text>
  <g fill="#333"><circle cx="760" cy="330" r="4"/><circle cx="760" cy="375" r="4"/></g>

  <!-- flyback diode branch -->
  <path d="M718 330 V375 H760" stroke="#333" stroke-width="2" fill="none"/>
  <polygon points="710,368 726,368 718,354" fill="#333"/>
  <line x1="708" y1="351" x2="728" y2="351" stroke="#333" stroke-width="3.5"/>
  <circle cx="718" cy="330" r="4" fill="#333"/>

  <!-- (-) return to wart -->
  <path d="M760 375 V465 H965 V196" stroke="#2e9e4f" stroke-width="3" fill="none"/>
  <text x="800" y="458" fill="#2e9e4f" font-size="12">(−) return to the wart</text>

  <!-- diode callout -->
  <rect x="620" y="500" width="380" height="96" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="638" y="526" font-size="14" font-weight="bold">The flyback diode</text>
  <text x="638" y="550" font-size="12">Sits across the motor's own two terminals.</text>
  <text x="638" y="570" font-size="12">Striped end points at (+). 1N4001 or similar.</text>
  <text x="638" y="588" font-size="12" fill="#888">Backwards = dead short. Check the stripe.</text>
  <path d="M706 498 L716 424" stroke="#888" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <!-- notes -->
  <rect x="40" y="470" width="245" height="170" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="56" y="496" font-size="14" font-weight="bold">The path</text>
  <text x="56" y="520" font-size="12">wart (+) → COM</text>
  <text x="56" y="540" font-size="12">NO → motor (+)</text>
  <text x="56" y="560" font-size="12">motor (−) → wart (−)</text>
  <text x="56" y="588" font-size="12" fill="#d33">COM + NO, never NC.</text>
  <text x="56" y="608" font-size="12" fill="#555">Wart (−) does NOT tie</text>
  <text x="56" y="626" font-size="12" fill="#555">to ESP GND.</text>
</svg>
