<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" font-family="monospace" font-size="15">
  <rect width="1000" height="680" fill="#fafafa"/>
  <text x="500" y="40" font-size="24" font-weight="bold" text-anchor="middle">Steam cover — OPTION A: motor is AC</text>
  <text x="500" y="66" font-size="14" text-anchor="middle" fill="#555">Relay switches the mains that is already inside the machine. Nothing extra to buy.</text>
  <text x="500" y="88" font-size="13" text-anchor="middle" fill="#d33">Use this sheet if the AA battery tap gave a HUM or NOTHING.</text>

  <!-- mains buses -->
  <line x1="60" y1="130" x2="960" y2="130" stroke="#d33" stroke-width="3"/>
  <text x="70" y="122" fill="#d33" font-size="13">acl  LINE (hot)</text>
  <line x1="60" y1="628" x2="960" y2="628" stroke="#111" stroke-width="3"/>
  <text x="70" y="648" fill="#111" font-size="13">acn  NEUTRAL</text>

  <!-- ESP32 -->
  <rect x="50" y="200" width="190" height="210" rx="10" fill="#1b1b1b"/>
  <text x="145" y="232" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">ESP32</text>
  <g fill="#8f8"><circle cx="240" cy="270" r="5"/><circle cx="240" cy="310" r="5"/><circle cx="240" cy="350" r="5"/><circle cx="240" cy="390" r="5"/></g>
  <g fill="#fff" font-size="13" text-anchor="end">
    <text x="228" y="275">5V</text>
    <text x="228" y="315">GPIO32</text>
    <text x="228" y="355">GPIO33</text>
    <text x="228" y="395">GND</text>
  </g>

  <!-- relay module -->
  <rect x="400" y="215" width="250" height="215" rx="10" fill="#eef" stroke="#1a6fd4" stroke-width="2"/>
  <text x="525" y="243" text-anchor="middle" font-weight="bold" font-size="15">5V RELAY (1 ch)</text>
  <text x="525" y="261" text-anchor="middle" font-size="11" fill="#666">opto-isolated · jumper = LOW</text>
  <g font-size="13">
    <text x="412" y="275">VCC</text>
    <text x="412" y="315">IN</text>
    <text x="412" y="395">GND</text>
    <text x="638" y="275" text-anchor="end">COM</text>
    <text x="638" y="335" text-anchor="end">NO</text>
    <text x="638" y="395" text-anchor="end">NC</text>
  </g>
  <g fill="#333"><circle cx="400" cy="270" r="4"/><circle cx="400" cy="310" r="4"/><circle cx="400" cy="390" r="4"/>
                  <circle cx="650" cy="270" r="4"/><circle cx="650" cy="330" r="4"/><circle cx="650" cy="390" r="4"/></g>
  <text x="525" y="415" text-anchor="middle" font-size="11" fill="#888">contacts are isolated — dry contact</text>

  <!-- coil side wires -->
  <path d="M240 270 H400" stroke="#e8890c" stroke-width="2.5" fill="none"/>
  <text x="300" y="262" fill="#e8890c" font-size="12">5V</text>
  <path d="M240 310 H400" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <text x="290" y="302" fill="#1a6fd4" font-size="12">signal</text>
  <path d="M240 390 H400" stroke="#2e9e4f" stroke-width="2.5" fill="none"/>
  <text x="300" y="382" fill="#2e9e4f" font-size="12">GND</text>

  <!-- limit switch -->
  <rect x="330" y="470" width="270" height="80" rx="8" fill="#fff" stroke="#1a6fd4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="465" y="497" text-anchor="middle" font-size="14" font-weight="bold">cover limit switch</text>
  <text x="465" y="517" text-anchor="middle" font-size="12" fill="#555">blue / blue pair</text>
  <text x="465" y="536" text-anchor="middle" font-size="12" fill="#555">one wire → GPIO33 · other → GND</text>
  <path d="M240 350 H300 V510 H330" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <path d="M240 390 H316 V596 H465 V550" stroke="#2e9e4f" stroke-width="2.5" fill="none"/>

  <!-- mains side -->
  <path d="M650 270 H710 V130" stroke="#d33" stroke-width="3" fill="none"/>
  <text x="716" y="200" fill="#d33" font-size="12">LINE in</text>
  <path d="M650 330 H790" stroke="#d33" stroke-width="3" fill="none"/>
  <text x="690" y="322" fill="#d33" font-size="12">switched</text>
  <path d="M650 390 H680" stroke="#999" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="688" y="394" fill="#999" font-size="12">NC — leave empty</text>

  <!-- motor -->
  <rect x="790" y="290" width="170" height="90" rx="8" fill="#f7eaff" stroke="#8a3fd1" stroke-width="2"/>
  <text x="875" y="322" text-anchor="middle" font-size="15" font-weight="bold">COVER MOTOR</text>
  <text x="875" y="344" text-anchor="middle" font-size="12" fill="#555">AC · 23.6 Ω</text>
  <text x="875" y="363" text-anchor="middle" font-size="12" fill="#555">red / black pair</text>
  <path d="M875 380 V628" stroke="#111" stroke-width="3" fill="none"/>
  <text x="884" y="470" fill="#111" font-size="12">back to NEUTRAL</text>

  <!-- notes -->
  <rect x="40" y="470" width="245" height="150" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="56" y="496" font-size="14" font-weight="bold">The path</text>
  <text x="56" y="520" font-size="12">acl LINE → COM</text>
  <text x="56" y="540" font-size="12">NO → one motor wire</text>
  <text x="56" y="560" font-size="12">other motor wire → acn NEUTRAL</text>
  <text x="56" y="588" font-size="12" fill="#d33">Wire to COM + NO, never NC.</text>
  <text x="56" y="608" font-size="12" fill="#555">Boot HIGH = relay off = cover still.</text>
</svg>
