<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" font-family="monospace" font-size="15">
  <rect width="900" height="660" fill="#fafafa"/>
  <text x="450" y="40" font-size="24" font-weight="bold" text-anchor="middle">NTC temp sensor — 10k voltage divider (detail)</text>
  <text x="450" y="66" font-size="14" text-anchor="middle" fill="#555">One 10k resistor per thermistor. It is a T-junction, NOT inline.</text>

  <!-- ===== vertical divider on the left ===== -->
  <!-- 3V3 rail top -->
  <text x="300" y="130" text-anchor="end" font-size="16" fill="#e8892a" font-weight="bold">3V3</text>
  <circle cx="320" cy="125" r="5" fill="#e8892a"/>
  <line x1="320" y1="125" x2="320" y2="170" stroke="#e8892a" stroke-width="3"/>

  <!-- 10k resistor (top leg) -->
  <rect x="290" y="170" width="60" height="90" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="320" y="212" text-anchor="middle" font-size="18" font-weight="bold">10k</text>
  <text x="320" y="234" text-anchor="middle" font-size="12" fill="#666">fixed</text>

  <!-- wire from 10k down to junction -->
  <line x1="320" y1="260" x2="320" y2="320" stroke="#e8892a" stroke-width="3"/>

  <!-- JUNCTION dot -->
  <circle cx="320" cy="320" r="8" fill="#f5a623" stroke="#b45309" stroke-width="2"/>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#b45309" font-weight="bold">junction</text>

  <!-- branch to GPIO34 (signal) -->
  <line x1="320" y1="320" x2="560" y2="320" stroke="#1a6fd4" stroke-width="3"/>
  <polygon points="560,320 548,314 548,326" fill="#1a6fd4"/>
  <rect x="565" y="300" width="180" height="42" rx="6" fill="#eef" stroke="#1a6fd4" stroke-width="2"/>
  <text x="655" y="320" text-anchor="middle" font-size="15" fill="#1a6fd4" font-weight="bold">GPIO34</text>
  <text x="655" y="336" text-anchor="middle" font-size="11" fill="#1a6fd4">ADC1 read (input-only)</text>

  <!-- NTC thermistor (bottom leg) -->
  <line x1="320" y1="320" x2="320" y2="380" stroke="#2a9d3a" stroke-width="3"/>
  <rect x="288" y="380" width="64" height="90" rx="4" fill="#fff" stroke="#7a3" stroke-width="2"/>
  <!-- thermistor slash symbol -->
  <line x1="298" y1="462" x2="342" y2="388" stroke="#7a3" stroke-width="2"/>
  <polygon points="342,388 330,388 342,400" fill="#7a3"/>
  <text x="320" y="430" text-anchor="middle" font-size="15" font-weight="bold">NTC</text>

  <!-- wire NTC to GND -->
  <line x1="320" y1="470" x2="320" y2="510" stroke="#2a9d3a" stroke-width="3"/>
  <line x1="290" y1="510" x2="350" y2="510" stroke="#2a9d3a" stroke-width="4"/>
  <line x1="300" y1="518" x2="340" y2="518" stroke="#2a9d3a" stroke-width="3"/>
  <line x1="310" y1="526" x2="330" y2="526" stroke="#2a9d3a" stroke-width="2"/>
  <text x="365" y="514" font-size="16" fill="#2a9d3a" font-weight="bold">GND</text>

  <!-- ===== right-side explainer ===== -->
  <rect x="560" y="390" width="300" height="180" rx="8" fill="#fff" stroke="#999"/>
  <text x="575" y="416" font-weight="bold" font-size="15">How to read it</text>
  <text x="575" y="442" font-size="13">Vout = 3V3 x NTC / (NTC + 10k)</text>
  <text x="575" y="464" font-size="13">Hotter block -&gt; NTC drops -&gt; Vout drops.</text>
  <text x="575" y="490" font-size="12" fill="#a00">Use ADC1 only (GPIO32-39).</text>
  <text x="575" y="508" font-size="12" fill="#a00">ADC2 dies when WiFi is on.</text>
  <text x="575" y="534" font-size="12" fill="#555">Ntc1 heatblock -&gt; GPIO34.</text>
  <text x="575" y="552" font-size="12" fill="#555">Green-tab (if thermistor) -&gt; GPIO39,</text>
  <text x="575" y="568" font-size="12" fill="#555">its own identical 10k.</text>

  <!-- calibration note -->
  <text x="60" y="612" font-size="12" fill="#333">Calibration: meter Ntc1 at room temp, record the ohms -&gt; sets NTC_NOMINAL / NTC_BETA in firmware.</text>
  <text x="60" y="632" font-size="12" fill="#333">Confirm each fixed resistor really is ~10k (9.9-10.1k) before soldering.</text>
</svg>
