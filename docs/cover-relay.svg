<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" font-family="monospace" font-size="15">
  <rect width="960" height="640" fill="#fafafa"/>
  <text x="480" y="40" font-size="24" font-weight="bold" text-anchor="middle">Steam-cover motor — 5V opto relay (detail)</text>
  <text x="480" y="66" font-size="14" text-anchor="middle" fill="#555">Mechanical relay switches AC or DC. Coil side wires now; switch side after the AC/DC bump test.</text>

  <!-- ===== ESP32 (left) ===== -->
  <rect x="50" y="120" width="200" height="230" rx="10" fill="#1b1b1b"/>
  <text x="150" y="150" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">ESP32</text>
  <g fill="#8f8"><circle cx="250" cy="200" r="5"/><circle cx="250" cy="250" r="5"/><circle cx="250" cy="300" r="5"/></g>
  <g fill="#fff" font-size="13" text-anchor="end">
    <text x="238" y="205">5V</text>
    <text x="238" y="255">GPIO32</text>
    <text x="238" y="305">GND</text>
  </g>

  <!-- ===== RELAY MODULE (center) — coil / logic side ===== -->
  <rect x="420" y="110" width="240" height="250" rx="10" fill="#eef" stroke="#1a6fd4" stroke-width="2"/>
  <text x="540" y="138" text-anchor="middle" font-weight="bold" font-size="15">5V RELAY (1 ch)</text>
  <text x="540" y="156" text-anchor="middle" font-size="11" fill="#666">opto-isolated, active-LOW</text>

  <!-- coil-side pins on left of module -->
  <g fill="#1a6fd4"><circle cx="420" cy="200" r="5"/><circle cx="420" cy="250" r="5"/><circle cx="420" cy="300" r="5"/></g>
  <g font-size="13"><text x="432" y="205">VCC</text><text x="432" y="255">IN</text><text x="432" y="305">GND</text></g>

  <!-- wires ESP -> relay coil -->
  <line x1="250" y1="200" x2="420" y2="200" stroke="#e8892a" stroke-width="3"/>
  <text x="300" y="192" font-size="11" fill="#e8892a">5V</text>
  <line x1="250" y1="250" x2="420" y2="250" stroke="#1a6fd4" stroke-width="3"/>
  <text x="290" y="242" font-size="11" fill="#1a6fd4">signal</text>
  <line x1="250" y1="300" x2="420" y2="300" stroke="#2a9d3a" stroke-width="3"/>
  <text x="300" y="292" font-size="11" fill="#2a9d3a">GND</text>

  <!-- switch-side terminals on right of module -->
  <g fill="#333"><circle cx="660" cy="200" r="5"/><circle cx="660" cy="270" r="5"/><circle cx="660" cy="340" r="5"/></g>
  <g font-size="13" text-anchor="start"><text x="672" y="205">NO</text><text x="672" y="275">COM</text><text x="672" y="345">NC</text></g>
  <text x="540" y="330" text-anchor="middle" font-size="11" fill="#666">dry contact — no power of its own</text>

  <!-- active-low note -->
  <rect x="420" y="375" width="240" height="70" rx="6" fill="#fff" stroke="#999"/>
  <text x="430" y="397" font-size="12" font-weight="bold">Firmware</text>
  <text x="430" y="416" font-size="11">boot pin HIGH = relay OFF.</text>
  <text x="430" y="432" font-size="11">write LOW = relay ON (closes COM-NO).</text>

  <!-- ===== SWITCH SIDE: two options ===== -->
  <!-- Option A: AC (~65%) -->
  <rect x="720" y="110" width="210" height="180" rx="8" fill="#fee" stroke="#c33" stroke-width="2"/>
  <text x="825" y="134" text-anchor="middle" font-weight="bold" font-size="13" fill="#c33">A) COVER = AC (~65%)</text>
  <text x="825" y="156" text-anchor="middle" font-size="11">No wall wart needed.</text>
  <text x="740" y="182" font-size="12" fill="#d11">acl LINE -&gt; COM</text>
  <text x="740" y="204" font-size="12">NO -&gt; motor lead</text>
  <text x="740" y="226" font-size="12" fill="#111">motor -&gt; acn NEUTRAL</text>
  <text x="740" y="256" font-size="10" fill="#666">Relay switches mains already</text>
  <text x="740" y="270" font-size="10" fill="#666">in the machine already.</text>

  <!-- Option B: DC (~35%) -->
  <rect x="720" y="310" width="210" height="200" rx="8" fill="#eef" stroke="#1a6fd4" stroke-width="2"/>
  <text x="825" y="334" text-anchor="middle" font-weight="bold" font-size="13" fill="#1a6fd4">B) COVER = DC (~35%)</text>
  <text x="825" y="356" text-anchor="middle" font-size="11">Wall wart supplies it.</text>
  <text x="740" y="382" font-size="12" fill="#e8892a">adapter (+) -&gt; COM</text>
  <text x="740" y="404" font-size="12">NO -&gt; motor (+)</text>
  <text x="740" y="426" font-size="12" fill="#2a9d3a">motor (-) -&gt; adapter (-)</text>
  <text x="740" y="456" font-size="10" fill="#666">Match wall-wart V to motor.</text>
  <text x="740" y="470" font-size="10" fill="#666">Reverse = 2 channels flip polarity.</text>
  <text x="740" y="484" font-size="10" fill="#666">Add flyback diode across motor.</text>

  <!-- connector from module switch side to option boxes -->
  <line x1="660" y1="200" x2="720" y2="200" stroke="#333" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="660" y1="340" x2="700" y2="340" stroke="#333" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="700" y1="340" x2="700" y2="410" stroke="#333" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="700" y1="410" x2="720" y2="410" stroke="#333" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- bottom decision note -->
  <rect x="50" y="480" width="610" height="120" rx="8" fill="#fff" stroke="#999"/>
  <text x="65" y="506" font-weight="bold" font-size="14">Which option? Run the free bump test first.</text>
  <text x="65" y="530" font-size="12">Touch a 1.5V AA across the motor's red/black pair:</text>
  <text x="65" y="550" font-size="12">  directional kick / twitch  = DC  -&gt; Option B (wall wart).</text>
  <text x="65" y="570" font-size="12">  faint hum / buzz, no motion = AC  -&gt; Option A (mains).</text>
  <text x="65" y="590" font-size="11" fill="#666">Cover meters 23.6 ohm — same regime as the confirmed-AC pump, so AC (A) currently leads.</text>
</svg>
