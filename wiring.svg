<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1080" font-family="monospace" font-size="13">
  <rect width="1860" height="1080" fill="#fafafa"/>
  <text x="930" y="34" font-size="24" font-weight="bold" text-anchor="middle">zenith — Full Wiring</text>
  <text x="930" y="56" font-size="13" text-anchor="middle" fill="#555">Cuisinart DGB-30 + ESP32.  Machine UNPLUGGED while wiring; wall plug in LAST, live test only.</text>

  <!-- ===== LEGEND ===== -->
  <g>
    <rect x="1420" y="60" width="400" height="140" rx="8" fill="#fff" stroke="#999"/>
    <text x="1435" y="82" font-weight="bold">KEY</text>
    <line x1="1435" y1="98" x2="1475" y2="98" stroke="#d11" stroke-width="5"/><text x="1485" y="102">MAINS LINE (hot / acl)</text>
    <line x1="1435" y1="118" x2="1475" y2="118" stroke="#111" stroke-width="5"/><text x="1485" y="122">MAINS NEUTRAL (acn)</text>
    <line x1="1435" y1="138" x2="1475" y2="138" stroke="#e8892a" stroke-width="2.5"/><text x="1485" y="142">DC +5V / +3V3</text>
    <line x1="1435" y1="158" x2="1475" y2="158" stroke="#1a6fd4" stroke-width="2.5"/><text x="1485" y="162">SIGNAL (GPIO / sensor)</text>
    <line x1="1435" y1="178" x2="1475" y2="178" stroke="#2a9d3a" stroke-width="2.5"/><text x="1485" y="182">DC GND / common</text>
    <text x="1435" y="197" font-size="11" fill="#a00">Crossing WITHOUT a dot = NOT connected.</text>
  </g>

  <!-- ===== MACHINE BOUNDARY ===== -->
  <rect x="40" y="150" width="1780" height="890" rx="12" fill="none" stroke="#bbb" stroke-dasharray="8 6"/>
  <text x="58" y="172" fill="#999" font-size="12">MACHINE ENCLOSURE</text>

  <!-- ===== WALL PLUG ===== -->
  <rect x="80" y="78" width="150" height="52" rx="6" fill="#eee" stroke="#333"/>
  <text x="155" y="100" text-anchor="middle" font-weight="bold" font-size="12">WALL PLUG</text>
  <text x="155" y="118" text-anchor="middle" font-size="11">120 VAC</text>
  <rect x="118" y="66" width="10" height="14" fill="#888"/><rect x="182" y="66" width="10" height="14" fill="#888"/>
  <line x1="180" y1="130" x2="180" y2="210" stroke="#d11" stroke-width="5"/>
  <line x1="125" y1="130" x2="125" y2="270" stroke="#111" stroke-width="5"/>
  <text x="188" y="150" fill="#d11" font-size="11">L</text>
  <text x="100" y="150" fill="#111" font-size="11">N</text>

  <!-- ===== MAINS BUSES ===== -->
  <line x1="160" y1="210" x2="1520" y2="210" stroke="#d11" stroke-width="5"/>
  <text x="980" y="204" fill="#d11" font-weight="bold" font-size="13">acl LINE (hot)</text>
  <line x1="110" y1="270" x2="1760" y2="270" stroke="#111" stroke-width="5"/>
  <text x="980" y="264" fill="#111" font-weight="bold" font-size="13">acn NEUTRAL</text>
  <circle cx="180" cy="210" r="4" fill="#d11"/><circle cx="125" cy="270" r="4" fill="#111"/>

  <!-- ===== AC-DC ADAPTER ===== -->
  <rect x="250" y="320" width="190" height="100" rx="8" fill="#fff3e0" stroke="#e8892a"/>
  <text x="345" y="343" text-anchor="middle" font-weight="bold" font-size="12">AC-DC ADAPTER</text>
  <text x="345" y="361" text-anchor="middle" font-size="11">5V USB brick</text>
  <text x="345" y="377" text-anchor="middle" font-size="10" fill="#666">(mounted in machine)</text>
  <text x="345" y="407" text-anchor="middle" font-size="10" fill="#666">powers the ESP32</text>
  <line x1="300" y1="210" x2="300" y2="320" stroke="#d11" stroke-width="4"/><circle cx="300" cy="210" r="4" fill="#d11"/>
  <line x1="350" y1="270" x2="350" y2="320" stroke="#111" stroke-width="4"/><circle cx="350" cy="270" r="4" fill="#111"/>
  <path d="M440 375 H540 V890 H660" stroke="#e8892a" stroke-width="2.5" fill="none"/>
  <text x="470" y="368" fill="#e8892a" font-size="11">+5V</text>
  <path d="M440 400 H500 V960" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>
  <text x="462" y="418" fill="#2a9d3a" font-size="11">GND</text>

  <!-- ===== ESP32 ===== -->
  <rect x="580" y="440" width="300" height="470" rx="10" fill="#1b1b1b"/>
  <text x="730" y="468" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">ESP32-DevKitC</text>
  <text x="730" y="486" fill="#8f8" font-size="11" text-anchor="middle">powered by 5V from adapter</text>
  <g fill="#fff" font-size="12">
    <text x="596" y="519">3V3</text>
    <text x="596" y="559">GPIO34</text>
    <text x="596" y="599">GPIO14</text>
    <text x="596" y="639">GPIO35</text>
    <text x="596" y="679">GPIO33</text>
    <text x="596" y="804">GND</text>
  </g>
  <g fill="#8f8"><circle cx="580" cy="515" r="4"/><circle cx="580" cy="555" r="4"/><circle cx="580" cy="595" r="4"/><circle cx="580" cy="635" r="4"/><circle cx="580" cy="675" r="4"/><circle cx="580" cy="800" r="4"/></g>
  <g fill="#fff" font-size="12" text-anchor="end">
    <text x="864" y="494">GPIO25</text>
    <text x="864" y="579">GPIO26</text>
    <text x="864" y="664">GPIO27</text>
    <text x="864" y="749">GPIO32</text>
  </g>
  <g fill="#8f8"><circle cx="880" cy="490" r="4"/><circle cx="880" cy="575" r="4"/><circle cx="880" cy="660" r="4"/><circle cx="880" cy="745" r="4"/></g>
  <g fill="#fff" font-size="11"><text x="648" y="884">5V</text><text x="704" y="884">GND</text></g>
  <circle cx="660" cy="890" r="4" fill="#8f8"/><circle cx="720" cy="890" r="4" fill="#8f8"/>

  <!-- ===== SENSORS (left) ===== -->
  <text x="60" y="458" font-size="14" font-weight="bold">SENSORS (DC — safe)</text>

  <rect x="60" y="470" width="200" height="86" rx="6" fill="#fff" stroke="#c33"/>
  <text x="160" y="490" text-anchor="middle" font-weight="bold" font-size="12">Ntc1 heat temp</text>
  <!-- T-divider inset: 3V3 -[10k]-•- NTC -GND, GPIO34 branches off • -->
  <text x="72" y="527" font-size="9" fill="#e8892a">3V3</text>
  <line x1="90" y1="524" x2="100" y2="524" stroke="#e8892a" stroke-width="2"/>
  <rect x="100" y="517" width="30" height="14" fill="#eee" stroke="#333"/><text x="115" y="527" text-anchor="middle" font-size="8">10k</text>
  <line x1="130" y1="524" x2="150" y2="524" stroke="#e8892a" stroke-width="2"/>
  <circle cx="151" cy="524" r="3.5" fill="#f5a623" stroke="#b45309"/>
  <line x1="151" y1="524" x2="163" y2="524" stroke="#333" stroke-width="2"/>
  <rect x="163" y="517" width="30" height="14" fill="#fff" stroke="#7a3"/><text x="178" y="527" text-anchor="middle" font-size="8">NTC</text>
  <line x1="193" y1="524" x2="212" y2="524" stroke="#2a9d3a" stroke-width="2"/>
  <text x="216" y="527" font-size="9" fill="#2a9d3a">GND</text>
  <line x1="151" y1="524" x2="151" y2="545" stroke="#1a6fd4" stroke-width="2"/>
  <text x="158" y="551" font-size="9" fill="#1a6fd4">GPIO34 (read, off junction)</text>
  <line x1="260" y1="508" x2="580" y2="515" stroke="#e8892a" stroke-width="2.5"/>
  <line x1="260" y1="523" x2="580" y2="555" stroke="#1a6fd4" stroke-width="2.5"/>
  <path d="M160 556 V960" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <rect x="60" y="566" width="200" height="48" rx="6" fill="#fff" stroke="#1a6fd4"/>
  <text x="160" y="586" text-anchor="middle" font-weight="bold" font-size="12">Float / level</text>
  <text x="160" y="604" text-anchor="middle" font-size="10">switch: GPIO14 + GND</text>
  <line x1="260" y1="584" x2="580" y2="595" stroke="#1a6fd4" stroke-width="2.5"/>
  <path d="M200 614 V960" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <rect x="60" y="624" width="200" height="60" rx="6" fill="#fff" stroke="#7a3"/>
  <text x="160" y="644" text-anchor="middle" font-weight="bold" font-size="12">flu = FLOW (Hall)</text>
  <text x="160" y="662" text-anchor="middle" font-size="10">VCC / SIG(GPIO35) / GND</text>
  <line x1="260" y1="642" x2="580" y2="515" stroke="#e8892a" stroke-width="2"/>
  <line x1="260" y1="656" x2="580" y2="635" stroke="#1a6fd4" stroke-width="2.5"/>
  <path d="M230 684 V960" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <rect x="60" y="694" width="200" height="56" rx="6" fill="#fff" stroke="#96c"/>
  <text x="160" y="714" text-anchor="middle" font-weight="bold" font-size="12">cover limit sw</text>
  <text x="160" y="732" text-anchor="middle" font-size="10">blue/blue: GPIO33 + GND</text>
  <line x1="260" y1="712" x2="580" y2="675" stroke="#1a6fd4" stroke-width="2.5"/>
  <path d="M215 750 V960" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <rect x="60" y="760" width="200" height="64" rx="6" fill="#fff" stroke="#3a3" stroke-dasharray="4 3"/>
  <text x="160" y="778" text-anchor="middle" font-weight="bold" font-size="12">green-tab (TBD)</text>
  <text x="160" y="794" text-anchor="middle" font-size="9">if thermistor: same 10k divider</text>
  <rect x="100" y="802" width="30" height="14" fill="#eee" stroke="#333"/><text x="115" y="812" text-anchor="middle" font-size="8">10k</text>
  <circle cx="151" cy="809" r="3.5" fill="#f5a623" stroke="#b45309"/>
  <line x1="130" y1="809" x2="150" y2="809" stroke="#e8892a" stroke-width="2"/>
  <text x="160" y="812" text-anchor="start" font-size="9" fill="#1a6fd4">GPIO39</text>

  <!-- ===== COMMON GND RAIL ===== -->
  <line x1="120" y1="960" x2="1120" y2="960" stroke="#2a9d3a" stroke-width="4"/>
  <text x="120" y="986" fill="#2a9d3a" font-size="12" font-weight="bold">COMMON GND: all sensor GND + all SSR term 4(−) + ESP GND + adapter GND tie here</text>
  <circle cx="720" cy="960" r="4" fill="#2a9d3a"/>
  <path d="M580 800 H540 V960" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>
  <path d="M720 890 V960" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <!-- ================= SSRs ================= -->
  <text x="1140" y="292" font-size="14" font-weight="bold">SSRs (control left · mains right)</text>

  <g>
    <rect x="1140" y="300" width="200" height="120" rx="6" fill="#fff" stroke="#333"/>
    <text x="1240" y="322" text-anchor="middle" font-weight="bold" font-size="12">SSR — HEATER</text>
    <text x="1152" y="342" font-size="11" fill="#1a6fd4">3(+)</text>
    <text x="1152" y="392" font-size="11" fill="#2a9d3a">4(−)</text>
    <text x="1328" y="342" font-size="11" text-anchor="end" fill="#d11">1</text>
    <text x="1328" y="392" font-size="11" text-anchor="end" fill="#111">2</text>
    <text x="1240" y="410" text-anchor="middle" font-size="9" fill="#c33">HEATSINK · no snubber</text>
  </g>
  <g>
    <rect x="1140" y="450" width="200" height="120" rx="6" fill="#fff" stroke="#333"/>
    <text x="1240" y="472" text-anchor="middle" font-weight="bold" font-size="12">SSR — PUMP</text>
    <text x="1152" y="492" font-size="11" fill="#1a6fd4">3(+)</text>
    <text x="1152" y="542" font-size="11" fill="#2a9d3a">4(−)</text>
    <text x="1328" y="492" font-size="11" text-anchor="end" fill="#d11">1</text>
    <text x="1328" y="542" font-size="11" text-anchor="end" fill="#111">2</text>
    <text x="1240" y="560" text-anchor="middle" font-size="9" fill="#7a3">+snubber across 1–2</text>
  </g>
  <g>
    <rect x="1140" y="600" width="200" height="120" rx="6" fill="#fff" stroke="#333"/>
    <text x="1240" y="622" text-anchor="middle" font-weight="bold" font-size="12">SSR — GRINDER</text>
    <text x="1152" y="642" font-size="11" fill="#1a6fd4">3(+)</text>
    <text x="1152" y="692" font-size="11" fill="#2a9d3a">4(−)</text>
    <text x="1328" y="642" font-size="11" text-anchor="end" fill="#d11">1</text>
    <text x="1328" y="692" font-size="11" text-anchor="end" fill="#111">2</text>
    <text x="1240" y="710" text-anchor="middle" font-size="9" fill="#7a3">+snubber across 1–2</text>
  </g>
  <g>
    <rect x="1140" y="750" width="200" height="120" rx="6" fill="#fff" stroke="#333"/>
    <text x="1240" y="772" text-anchor="middle" font-weight="bold" font-size="12">SSR — STEAM COVER</text>
    <text x="1152" y="792" font-size="11" fill="#1a6fd4">3(+)</text>
    <text x="1152" y="842" font-size="11" fill="#2a9d3a">4(−)</text>
    <text x="1328" y="792" font-size="11" text-anchor="end" fill="#d11">1</text>
    <text x="1328" y="842" font-size="11" text-anchor="end" fill="#111">2</text>
    <text x="1240" y="860" text-anchor="middle" font-size="9" fill="#7a3">+snubber · AC motor(?)</text>
  </g>

  <!-- ===== CONTROL WIRING (GPIO -> term3, blue, staggered) ===== -->
  <path d="M880 490 H1050 V335 H1140" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <path d="M880 575 H1070 V485 H1140" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <path d="M880 660 H1090 V635 H1140" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <path d="M880 745 H1110 V785 H1140" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>

  <!-- ===== term4 (-) common ground bus (green) ===== -->
  <path d="M1140 385 H1120 V835 H1140" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>
  <line x1="1140" y1="535" x2="1120" y2="535" stroke="#2a9d3a" stroke-width="2.5"/>
  <line x1="1140" y1="685" x2="1120" y2="685" stroke="#2a9d3a" stroke-width="2.5"/>
  <path d="M1120 835 V960" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>
  <circle cx="1120" cy="960" r="4" fill="#2a9d3a"/>

  <!-- ===== THERMAL CUTOFF on heater LINE ===== -->
  <rect x="1330" y="240" width="80" height="34" rx="5" fill="#ffecec" stroke="#c33"/>
  <text x="1370" y="262" text-anchor="middle" font-size="9" font-weight="bold">CUTOFF</text>
  <text x="1370" y="232" text-anchor="middle" font-size="9" fill="#c33">4-white safety — keep in series</text>

  <!-- ===== LINE feeds to SSR term1 (red, staggered x) ===== -->
  <path d="M1370 210 V240" stroke="#d11" stroke-width="4" fill="none"/><circle cx="1370" cy="210" r="4" fill="#d11"/>
  <path d="M1370 274 V335 H1340" stroke="#d11" stroke-width="4" fill="none"/>
  <path d="M1420 210 V485 H1340" stroke="#d11" stroke-width="4" fill="none"/><circle cx="1420" cy="210" r="4" fill="#d11"/>
  <path d="M1450 210 V635 H1340" stroke="#d11" stroke-width="4" fill="none"/><circle cx="1450" cy="210" r="4" fill="#d11"/>
  <path d="M1480 210 V785 H1340" stroke="#d11" stroke-width="4" fill="none"/><circle cx="1480" cy="210" r="4" fill="#d11"/>

  <!-- ===== term2 -> LOADS (red) ===== -->
  <line x1="1340" y1="385" x2="1540" y2="385" stroke="#d11" stroke-width="4"/>
  <line x1="1340" y1="535" x2="1540" y2="535" stroke="#d11" stroke-width="4"/>
  <line x1="1340" y1="685" x2="1540" y2="685" stroke="#d11" stroke-width="4"/>
  <line x1="1340" y1="835" x2="1540" y2="835" stroke="#d11" stroke-width="4"/>

  <!-- ===== LOADS (aligned to term2) ===== -->
  <rect x="1540" y="360" width="150" height="56" rx="6" fill="#fee" stroke="#c33"/>
  <text x="1615" y="384" text-anchor="middle" font-weight="bold" font-size="12">HEATER</text>
  <text x="1615" y="402" text-anchor="middle" font-size="9" fill="#666">red=hot · blue=neutral</text>

  <rect x="1540" y="510" width="150" height="50" rx="6" fill="#eef" stroke="#1a6fd4"/>
  <text x="1615" y="540" text-anchor="middle" font-weight="bold" font-size="12">PUMP MOTOR</text>

  <rect x="1540" y="660" width="150" height="50" rx="6" fill="#efe" stroke="#7a3"/>
  <text x="1615" y="690" text-anchor="middle" font-weight="bold" font-size="12">GRINDER MOT</text>

  <rect x="1540" y="810" width="150" height="50" rx="6" fill="#fef" stroke="#96c"/>
  <text x="1615" y="832" text-anchor="middle" font-weight="bold" font-size="11">STEAM COVER MOT</text>
  <text x="1615" y="848" text-anchor="middle" font-size="9" fill="#666">AC? confirm at bench</text>

  <!-- ===== LOAD neutral returns -> NEUTRAL bus (right of loads, staggered) ===== -->
  <path d="M1690 388 H1710 V270" stroke="#111" stroke-width="4" fill="none"/><circle cx="1710" cy="270" r="4" fill="#111"/>
  <path d="M1690 535 H1725 V270" stroke="#111" stroke-width="4" fill="none"/><circle cx="1725" cy="270" r="4" fill="#111"/>
  <path d="M1690 685 H1740 V270" stroke="#111" stroke-width="4" fill="none"/><circle cx="1740" cy="270" r="4" fill="#111"/>
  <path d="M1690 835 H1755 V270" stroke="#111" stroke-width="4" fill="none"/><circle cx="1755" cy="270" r="4" fill="#111"/>

  <!-- ===== NOTES ===== -->
  <g font-size="12" fill="#333">
    <text x="60" y="1016">Path per load:  acl LINE  →  SSR (term 1 → 2)  →  load  →  acn NEUTRAL.   Only the LINE leg is switched.</text>
    <text x="1060" y="1016" fill="#a00">Cover motor shown as AC (4th SSR). If DC → swap for H-bridge on GPIO32/33.</text>
  </g>
</svg>
