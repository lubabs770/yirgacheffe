<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" font-family="monospace" font-size="13">
  <rect width="1200" height="860" fill="#fafafa"/>
  <text x="600" y="30" font-size="22" font-weight="bold" text-anchor="middle">zenith — Wiring Diagram</text>
  <text x="600" y="52" font-size="12" text-anchor="middle" fill="#666">DGB-30 + ESP32.  RED=3V3/VCC/Line  BLACK=GND  BLUE=signal  THICK=MAINS AC</text>

  <!-- ================= ESP32 ================= -->
  <rect x="470" y="150" width="260" height="480" rx="10" fill="#1b1b1b"/>
  <text x="600" y="178" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">ESP32-DevKitC</text>
  <text x="600" y="196" fill="#8f8" font-size="11" text-anchor="middle">powered from 5V USB brick</text>

  <!-- left pins (sensors) -->
  <g fill="#fff">
    <text x="486" y="240">3V3</text>
    <text x="486" y="280">GPIO34</text>
    <text x="486" y="320">GPIO14</text>
    <text x="486" y="360">GPIO35</text>
    <text x="486" y="400">GPIO39</text>
    <text x="486" y="600">GND</text>
  </g>
  <!-- right pins (SSR control) -->
  <g fill="#fff" text-anchor="end">
    <text x="714" y="260">GPIO25</text>
    <text x="714" y="360">GPIO26</text>
    <text x="714" y="460">GPIO27</text>
    <text x="714" y="600">GND</text>
  </g>
  <!-- pin dots left -->
  <g fill="#8f8">
    <circle cx="470" cy="235" r="4"/><circle cx="470" cy="275" r="4"/>
    <circle cx="470" cy="315" r="4"/><circle cx="470" cy="355" r="4"/>
    <circle cx="470" cy="395" r="4"/><circle cx="470" cy="595" r="4"/>
  </g>
  <!-- pin dots right -->
  <g fill="#8f8">
    <circle cx="730" cy="255" r="4"/><circle cx="730" cy="355" r="4"/>
    <circle cx="730" cy="455" r="4"/><circle cx="730" cy="595" r="4"/>
  </g>

  <!-- ================= SENSORS (left) ================= -->
  <text x="150" y="150" font-size="15" font-weight="bold">SENSORS (DC — safe)</text>

  <!-- Ntc1 divider -->
  <rect x="40" y="200" width="150" height="90" rx="6" fill="#fff" stroke="#c33"/>
  <text x="115" y="222" text-anchor="middle" font-weight="bold">Ntc1 (heat temp)</text>
  <rect x="55" y="235" width="55" height="20" fill="#eee" stroke="#333"/>
  <text x="82" y="250" text-anchor="middle" font-size="10">10k</text>
  <text x="115" y="278" text-anchor="middle" font-size="10">3V3–10k–GPIO34–NTC–GND</text>
  <!-- 3V3 to resistor -->
  <line x1="55" y1="245" x2="30" y2="245" stroke="#c33" stroke-width="2"/>
  <path d="M30 245 V235 H470" stroke="#c33" stroke-width="2" fill="none"/>
  <!-- junction to GPIO34 -->
  <line x1="110" y1="245" x2="470" y2="275" stroke="#39c" stroke-width="2"/>
  <!-- ntc to GND -->
  <path d="M115 255 V300 H420 V595 H470" stroke="#111" stroke-width="2" fill="none"/>

  <!-- Float -->
  <rect x="40" y="305" width="150" height="45" rx="6" fill="#fff" stroke="#39c"/>
  <text x="115" y="325" text-anchor="middle" font-weight="bold">Float / level</text>
  <text x="115" y="342" text-anchor="middle" font-size="10">switch → GPIO14 + GND</text>
  <line x1="190" y1="318" x2="470" y2="315" stroke="#39c" stroke-width="2"/>
  <path d="M190 338 H410 V595 H470" stroke="#111" stroke-width="2" fill="none"/>

  <!-- Flow -->
  <rect x="40" y="365" width="150" height="60" rx="6" fill="#fff" stroke="#7a3"/>
  <text x="115" y="385" text-anchor="middle" font-weight="bold">flu = FLOW (Hall)</text>
  <text x="115" y="401" text-anchor="middle" font-size="10">VCC / GND / SIG</text>
  <text x="115" y="416" text-anchor="middle" font-size="9" fill="#666">3-wire, pulse count</text>
  <line x1="190" y1="378" x2="470" y2="235" stroke="#c33" stroke-width="1.5"/>
  <line x1="190" y1="392" x2="470" y2="355" stroke="#39c" stroke-width="2"/>
  <path d="M190 410 H400 V595 H470" stroke="#111" stroke-width="2" fill="none"/>

  <!-- Green tab -->
  <rect x="40" y="440" width="150" height="55" rx="6" fill="#fff" stroke="#999" stroke-dasharray="4"/>
  <text x="115" y="460" text-anchor="middle" font-weight="bold">green-tab (?)</text>
  <text x="115" y="476" text-anchor="middle" font-size="9" fill="#666">thermistor→GPIO39</text>
  <text x="115" y="489" text-anchor="middle" font-size="9" fill="#666">or cutoff→leave in mains</text>
  <line x1="190" y1="460" x2="470" y2="395" stroke="#39c" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- ================= SSRs + LOADS (right) ================= -->
  <text x="900" y="150" font-size="15" font-weight="bold">SSRs → LOADS (MAINS)</text>

  <!-- generic SSR macro drawn 3x -->
  <!-- Heater SSR -->
  <rect x="820" y="220" width="150" height="80" rx="6" fill="#fff" stroke="#333"/>
  <text x="895" y="242" text-anchor="middle" font-weight="bold">SSR — Heater</text>
  <text x="835" y="268" font-size="10">3(+) 4(–)</text>
  <text x="835" y="288" font-size="10">1  ~  2</text>
  <text x="960" y="235" font-size="9" fill="#c33" text-anchor="end">HEATSINK</text>
  <line x1="730" y1="255" x2="820" y2="262" stroke="#39c" stroke-width="2"/>
  <path d="M820 272 H770 V595 H730" stroke="#111" stroke-width="2" fill="none"/>

  <!-- Pump SSR -->
  <rect x="820" y="320" width="150" height="80" rx="6" fill="#fff" stroke="#333"/>
  <text x="895" y="342" text-anchor="middle" font-weight="bold">SSR — Pump</text>
  <text x="835" y="368" font-size="10">3(+) 4(–)</text>
  <text x="835" y="388" font-size="10">1  ~  2</text>
  <text x="960" y="335" font-size="9" fill="#7a3" text-anchor="end">+snubber</text>
  <line x1="730" y1="355" x2="820" y2="362" stroke="#39c" stroke-width="2"/>
  <path d="M820 372 H780 V595 H730" stroke="#111" stroke-width="2" fill="none"/>

  <!-- Grinder SSR -->
  <rect x="820" y="420" width="150" height="80" rx="6" fill="#fff" stroke="#333"/>
  <text x="895" y="442" text-anchor="middle" font-weight="bold">SSR — Grinder</text>
  <text x="835" y="468" font-size="10">3(+) 4(–)</text>
  <text x="835" y="488" font-size="10">1  ~  2</text>
  <text x="960" y="435" font-size="9" fill="#7a3" text-anchor="end">+snubber</text>
  <line x1="730" y1="455" x2="820" y2="462" stroke="#39c" stroke-width="2"/>
  <path d="M820 472 H790 V595 H730" stroke="#111" stroke-width="2" fill="none"/>

  <!-- ================= MAINS BUS ================= -->
  <text x="600" y="690" font-size="15" font-weight="bold" text-anchor="middle" fill="#a00">MAINS AC — wire LAST, wall plug in only for live test</text>

  <!-- Line bus -->
  <line x1="1000" y1="720" x2="200" y2="720" stroke="#c33" stroke-width="5"/>
  <text x="1010" y="724" fill="#c33" font-weight="bold">acl (Line)</text>
  <!-- Neutral bus -->
  <line x1="1000" y1="790" x2="200" y2="790" stroke="#111" stroke-width="5"/>
  <text x="1010" y="794" fill="#111" font-weight="bold">acn (Neutral)</text>

  <!-- Line -> each SSR term1 -->
  <line x1="895" y1="720" x2="895" y2="300" stroke="#c33" stroke-width="3"/>
  <text x="905" y="315" font-size="9" fill="#c33">Line→SSR term1</text>
  <line x1="895" y1="720" x2="895" y2="400" stroke="#c33" stroke-width="3"/>
  <line x1="895" y1="720" x2="895" y2="500" stroke="#c33" stroke-width="3"/>

  <!-- Loads: SSR term2 -> load -> neutral -->
  <!-- Heater load -->
  <rect x="300" y="600" width="120" height="40" rx="6" fill="#fee" stroke="#c33"/>
  <text x="360" y="625" text-anchor="middle" font-weight="bold">HEATER</text>
  <path d="M820 292 H360 V600" stroke="#c33" stroke-width="3" fill="none"/>
  <line x1="360" y1="640" x2="360" y2="790" stroke="#111" stroke-width="3"/>

  <!-- Pump load -->
  <rect x="300" y="660" width="120" height="35" rx="6" fill="#eef" stroke="#39c"/>
  <text x="360" y="683" text-anchor="middle" font-weight="bold">PUMP mot</text>
  <path d="M820 392 H250 V677 H300" stroke="#c33" stroke-width="3" fill="none"/>
  <line x1="360" y1="695" x2="360" y2="790" stroke="#111" stroke-width="3"/>

  <!-- Grinder load -->
  <rect x="300" y="715" width="120" height="35" rx="6" fill="#efe" stroke="#7a3"/>
  <text x="360" y="738" text-anchor="middle" font-weight="bold">GRINDER mot</text>
  <path d="M820 492 H230 V732 H300" stroke="#c33" stroke-width="3" fill="none"/>
  <line x1="360" y1="750" x2="360" y2="790" stroke="#111" stroke-width="3"/>

  <!-- legend note -->
  <text x="40" y="830" font-size="11" fill="#666">Path per load: acl(Line) → SSR(1→2) → load → acn(Neutral).  Only the Line leg is switched.  Common GND ties all sensor grounds + SSR term4 + ESP GND.</text>
</svg>
