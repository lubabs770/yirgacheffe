<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" font-family="monospace" font-size="13">
  <rect width="1600" height="1060" fill="#fafafa"/>
  <text x="800" y="34" font-size="24" font-weight="bold" text-anchor="middle">zenith — Full Wiring</text>
  <text x="800" y="56" font-size="13" text-anchor="middle" fill="#555">Cuisinart DGB-30 + ESP32.  Machine UNPLUGGED while wiring; wall plug in LAST, live test only.</text>

  <!-- ===== LEGEND ===== -->
  <g>
    <rect x="1180" y="70" width="390" height="150" rx="8" fill="#fff" stroke="#999"/>
    <text x="1195" y="92" font-weight="bold">KEY</text>
    <line x1="1195" y1="108" x2="1235" y2="108" stroke="#d11" stroke-width="5"/><text x="1245" y="112">MAINS LINE (hot / acl)</text>
    <line x1="1195" y1="128" x2="1235" y2="128" stroke="#111" stroke-width="5"/><text x="1245" y="132">MAINS NEUTRAL (acn)</text>
    <line x1="1195" y1="148" x2="1235" y2="148" stroke="#e8892a" stroke-width="2.5"/><text x="1245" y="152">DC +5V / +3V3</text>
    <line x1="1195" y1="168" x2="1235" y2="168" stroke="#1a6fd4" stroke-width="2.5"/><text x="1245" y="172">SIGNAL (GPIO / sensor)</text>
    <line x1="1195" y1="188" x2="1235" y2="188" stroke="#2a9d3a" stroke-width="2.5"/><text x="1245" y="192">DC GND / common</text>
    <text x="1195" y="211" font-size="11" fill="#a00">Crossing WITHOUT a dot = NOT connected.</text>
  </g>

  <!-- ===== MACHINE BOUNDARY ===== -->
  <rect x="40" y="150" width="1520" height="870" rx="12" fill="none" stroke="#bbb" stroke-dasharray="8 6"/>
  <text x="58" y="172" fill="#999" font-size="12">MACHINE ENCLOSURE</text>

  <!-- ===== WALL PLUG ===== -->
  <rect x="80" y="78" width="150" height="52" rx="6" fill="#eee" stroke="#333"/>
  <text x="155" y="100" text-anchor="middle" font-weight="bold" font-size="12">WALL PLUG</text>
  <text x="155" y="118" text-anchor="middle" font-size="11">120 VAC</text>
  <rect x="118" y="66" width="10" height="14" fill="#888"/><rect x="182" y="66" width="10" height="14" fill="#888"/>
  <line x1="180" y1="130" x2="180" y2="210" stroke="#d11" stroke-width="5"/>
  <line x1="125" y1="130" x2="125" y2="255" stroke="#111" stroke-width="5"/>
  <text x="188" y="150" fill="#d11" font-size="11">L</text>
  <text x="100" y="150" fill="#111" font-size="11">N</text>

  <!-- ===== MAINS BUSES ===== -->
  <line x1="160" y1="210" x2="1500" y2="210" stroke="#d11" stroke-width="5"/>
  <text x="1508" y="214" fill="#d11" font-weight="bold" font-size="12">acl LINE</text>
  <line x1="110" y1="255" x2="1540" y2="255" stroke="#111" stroke-width="5"/>
  <text x="1508" y="278" fill="#111" font-weight="bold" font-size="12">acn NEUTRAL</text>
  <circle cx="180" cy="210" r="4" fill="#d11"/><circle cx="125" cy="255" r="4" fill="#111"/>

  <!-- ===== AC-DC ADAPTER ===== -->
  <rect x="250" y="305" width="190" height="100" rx="8" fill="#fff3e0" stroke="#e8892a"/>
  <text x="345" y="328" text-anchor="middle" font-weight="bold" font-size="12">AC-DC ADAPTER</text>
  <text x="345" y="346" text-anchor="middle" font-size="11">5V USB brick</text>
  <text x="345" y="362" text-anchor="middle" font-size="10" fill="#666">(mounted in machine)</text>
  <text x="345" y="392" text-anchor="middle" font-size="10" fill="#666">powers the ESP32</text>
  <line x1="300" y1="210" x2="300" y2="305" stroke="#d11" stroke-width="4"/><circle cx="300" cy="210" r="4" fill="#d11"/>
  <line x1="390" y1="255" x2="390" y2="305" stroke="#111" stroke-width="4"/><circle cx="390" cy="255" r="4" fill="#111"/>
  <path d="M440 360 H650 V870" stroke="#e8892a" stroke-width="2.5" fill="none"/>
  <text x="470" y="352" fill="#e8892a" font-size="11">+5V</text>
  <path d="M440 385 H500 V952 H700" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>
  <text x="470" y="402" fill="#2a9d3a" font-size="11">GND</text>

  <!-- ===== ESP32 ===== -->
  <rect x="560" y="430" width="300" height="470" rx="10" fill="#1b1b1b"/>
  <text x="710" y="458" fill="#fff" font-size="17" font-weight="bold" text-anchor="middle">ESP32-DevKitC</text>
  <text x="710" y="476" fill="#8f8" font-size="11" text-anchor="middle">powered by 5V from adapter</text>
  <g fill="#fff" font-size="12">
    <text x="576" y="512">3V3</text>
    <text x="576" y="546">GPIO34</text>
    <text x="576" y="580">GPIO14</text>
    <text x="576" y="614">GPIO35</text>
    <text x="576" y="648">GPIO33</text>
    <text x="576" y="770">GND</text>
  </g>
  <g fill="#8f8"><circle cx="560" cy="508" r="4"/><circle cx="560" cy="542" r="4"/><circle cx="560" cy="576" r="4"/><circle cx="560" cy="610" r="4"/><circle cx="560" cy="644" r="4"/><circle cx="560" cy="766" r="4"/></g>
  <g fill="#fff" font-size="12" text-anchor="end">
    <text x="844" y="474">GPIO25</text>
    <text x="844" y="564">GPIO26</text>
    <text x="844" y="654">GPIO27</text>
    <text x="844" y="744">GPIO32</text>
  </g>
  <g fill="#8f8"><circle cx="860" cy="470" r="4"/><circle cx="860" cy="560" r="4"/><circle cx="860" cy="650" r="4"/><circle cx="860" cy="740" r="4"/></g>
  <g fill="#fff" font-size="11"><text x="632" y="892">5V</text><text x="688" y="892">GND</text></g>
  <circle cx="650" cy="870" r="4" fill="#8f8"/><circle cx="700" cy="895" r="4" fill="#8f8"/>

  <!-- ===== SENSORS (left) ===== -->
  <text x="70" y="440" font-size="14" font-weight="bold">SENSORS (DC — safe)</text>

  <rect x="60" y="452" width="200" height="86" rx="6" fill="#fff" stroke="#c33"/>
  <text x="160" y="472" text-anchor="middle" font-weight="bold" font-size="12">Ntc1 heat temp</text>
  <rect x="90" y="482" width="46" height="18" fill="#eee" stroke="#333"/><text x="113" y="496" text-anchor="middle" font-size="10">10k</text>
  <text x="160" y="522" text-anchor="middle" font-size="10">3V3–10k–GPIO34–NTC–GND</text>
  <line x1="260" y1="490" x2="560" y2="508" stroke="#e8892a" stroke-width="2.5"/>
  <line x1="260" y1="505" x2="560" y2="542" stroke="#1a6fd4" stroke-width="2.5"/>
  <path d="M160 538 V952" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <rect x="60" y="548" width="200" height="48" rx="6" fill="#fff" stroke="#1a6fd4"/>
  <text x="160" y="568" text-anchor="middle" font-weight="bold" font-size="12">Float / level</text>
  <text x="160" y="586" text-anchor="middle" font-size="10">switch: GPIO14 + GND</text>
  <line x1="260" y1="566" x2="560" y2="576" stroke="#1a6fd4" stroke-width="2.5"/>
  <path d="M200 596 V952" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <rect x="60" y="606" width="200" height="60" rx="6" fill="#fff" stroke="#7a3"/>
  <text x="160" y="626" text-anchor="middle" font-weight="bold" font-size="12">flu = FLOW (Hall)</text>
  <text x="160" y="644" text-anchor="middle" font-size="10">VCC / SIG(GPIO35) / GND</text>
  <line x1="260" y1="624" x2="560" y2="508" stroke="#e8892a" stroke-width="2"/>
  <line x1="260" y1="638" x2="560" y2="610" stroke="#1a6fd4" stroke-width="2.5"/>
  <path d="M230 666 V952" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <rect x="60" y="676" width="200" height="56" rx="6" fill="#fff" stroke="#96c"/>
  <text x="160" y="696" text-anchor="middle" font-weight="bold" font-size="12">cover limit sw</text>
  <text x="160" y="714" text-anchor="middle" font-size="10">blue/blue: GPIO33 + GND</text>
  <line x1="260" y1="694" x2="560" y2="644" stroke="#1a6fd4" stroke-width="2.5"/>
  <path d="M215 732 V952" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>

  <!-- ===== COMMON GND RAIL ===== -->
  <line x1="120" y1="952" x2="1100" y2="952" stroke="#2a9d3a" stroke-width="4"/>
  <text x="120" y="978" fill="#2a9d3a" font-size="12" font-weight="bold">COMMON GND: all sensor GND + all SSR term 4(−) + ESP GND + adapter GND tie here</text>
  <circle cx="700" cy="952" r="4" fill="#2a9d3a"/>

  <!-- ================= SSRs ================= -->
  <text x="1120" y="292" font-size="14" font-weight="bold">SSRs (control left · mains right)</text>

  <g>
    <rect x="1120" y="300" width="200" height="120" rx="6" fill="#fff" stroke="#333"/>
    <text x="1220" y="322" text-anchor="middle" font-weight="bold" font-size="12">SSR — HEATER</text>
    <text x="1132" y="342" font-size="11" fill="#1a6fd4">3(+)</text>
    <text x="1132" y="392" font-size="11" fill="#2a9d3a">4(−)</text>
    <text x="1300" y="342" font-size="11" text-anchor="end" fill="#d11">1</text>
    <text x="1300" y="392" font-size="11" text-anchor="end" fill="#111">2</text>
    <text x="1220" y="410" text-anchor="middle" font-size="9" fill="#c33">HEATSINK · no snubber</text>
  </g>
  <g>
    <rect x="1120" y="450" width="200" height="120" rx="6" fill="#fff" stroke="#333"/>
    <text x="1220" y="472" text-anchor="middle" font-weight="bold" font-size="12">SSR — PUMP</text>
    <text x="1132" y="492" font-size="11" fill="#1a6fd4">3(+)</text>
    <text x="1132" y="542" font-size="11" fill="#2a9d3a">4(−)</text>
    <text x="1300" y="492" font-size="11" text-anchor="end" fill="#d11">1</text>
    <text x="1300" y="542" font-size="11" text-anchor="end" fill="#111">2</text>
    <text x="1220" y="560" text-anchor="middle" font-size="9" fill="#7a3">+snubber across 1–2</text>
  </g>
  <g>
    <rect x="1120" y="600" width="200" height="120" rx="6" fill="#fff" stroke="#333"/>
    <text x="1220" y="622" text-anchor="middle" font-weight="bold" font-size="12">SSR — GRINDER</text>
    <text x="1132" y="642" font-size="11" fill="#1a6fd4">3(+)</text>
    <text x="1132" y="692" font-size="11" fill="#2a9d3a">4(−)</text>
    <text x="1300" y="642" font-size="11" text-anchor="end" fill="#d11">1</text>
    <text x="1300" y="692" font-size="11" text-anchor="end" fill="#111">2</text>
    <text x="1220" y="710" text-anchor="middle" font-size="9" fill="#7a3">+snubber across 1–2</text>
  </g>
  <g>
    <rect x="1120" y="750" width="200" height="120" rx="6" fill="#fff" stroke="#333"/>
    <text x="1220" y="772" text-anchor="middle" font-weight="bold" font-size="12">SSR — STEAM COVER</text>
    <text x="1132" y="792" font-size="11" fill="#1a6fd4">3(+)</text>
    <text x="1132" y="842" font-size="11" fill="#2a9d3a">4(−)</text>
    <text x="1300" y="792" font-size="11" text-anchor="end" fill="#d11">1</text>
    <text x="1300" y="842" font-size="11" text-anchor="end" fill="#111">2</text>
    <text x="1220" y="860" text-anchor="middle" font-size="9" fill="#7a3">+snubber · AC motor(?)</text>
  </g>

  <!-- ===== CONTROL WIRING (GPIO -> term3, blue) ===== -->
  <path d="M860 470 H1040 V335 H1120" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <path d="M860 560 H1055 V485 H1120" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <path d="M860 650 H1070 V635 H1120" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>
  <path d="M860 740 H1085 V785 H1120" stroke="#1a6fd4" stroke-width="2.5" fill="none"/>

  <!-- ===== term4 (-) common ground bus (green) ===== -->
  <path d="M1120 385 H1098 V835 H1120" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>
  <line x1="1120" y1="535" x2="1098" y2="535" stroke="#2a9d3a" stroke-width="2.5"/>
  <line x1="1120" y1="685" x2="1098" y2="685" stroke="#2a9d3a" stroke-width="2.5"/>
  <path d="M1098 835 V952" stroke="#2a9d3a" stroke-width="2.5" fill="none"/>
  <circle cx="1098" cy="952" r="4" fill="#2a9d3a"/>

  <!-- ===== THERMAL CUTOFF on heater LINE ===== -->
  <rect x="1350" y="240" width="150" height="34" rx="5" fill="#ffecec" stroke="#c33"/>
  <text x="1425" y="262" text-anchor="middle" font-size="10" font-weight="bold">THERMAL CUTOFF</text>
  <text x="1425" y="230" text-anchor="middle" font-size="9" fill="#c33">4-white safety — KEEP in series</text>

  <!-- ===== LINE feeds to SSR term1 (red) ===== -->
  <path d="M1425 210 V240" stroke="#d11" stroke-width="4" fill="none"/><circle cx="1425" cy="210" r="4" fill="#d11"/>
  <path d="M1425 274 V335 H1320" stroke="#d11" stroke-width="4" fill="none"/>
  <path d="M1360 210 V485 H1320" stroke="#d11" stroke-width="4" fill="none"/><circle cx="1360" cy="210" r="4" fill="#d11"/>
  <path d="M1385 210 V635 H1320" stroke="#d11" stroke-width="4" fill="none"/><circle cx="1385" cy="210" r="4" fill="#d11"/>
  <path d="M1410 210 V785 H1320" stroke="#d11" stroke-width="4" fill="none"/><circle cx="1410" cy="210" r="4" fill="#d11"/>

  <!-- ===== LOADS (right of SSRs) ===== -->
  <rect x="1410" y="352" width="140" height="56" rx="6" fill="#fee" stroke="#c33"/>
  <text x="1480" y="376" text-anchor="middle" font-weight="bold" font-size="12">HEATER</text>
  <text x="1480" y="394" text-anchor="middle" font-size="9" fill="#666">red=hot · blue=neutral</text>
  <line x1="1320" y1="385" x2="1410" y2="385" stroke="#d11" stroke-width="4"/>
  <path d="M1480 408 V920 H540 V952" stroke="#111" stroke-width="4" fill="none"/>

  <rect x="1410" y="502" width="140" height="50" rx="6" fill="#eef" stroke="#1a6fd4"/>
  <text x="1480" y="532" text-anchor="middle" font-weight="bold" font-size="12">PUMP MOTOR</text>
  <line x1="1320" y1="535" x2="1410" y2="535" stroke="#d11" stroke-width="4"/>
  <path d="M1500 502 V255" stroke="#111" stroke-width="4" fill="none"/><circle cx="1500" cy="255" r="4" fill="#111"/>

  <rect x="1410" y="652" width="140" height="50" rx="6" fill="#efe" stroke="#7a3"/>
  <text x="1480" y="682" text-anchor="middle" font-weight="bold" font-size="12">GRINDER MOT</text>
  <line x1="1320" y1="685" x2="1410" y2="685" stroke="#d11" stroke-width="4"/>
  <path d="M1520 652 V255" stroke="#111" stroke-width="4" fill="none"/><circle cx="1520" cy="255" r="4" fill="#111"/>

  <rect x="1410" y="802" width="140" height="50" rx="6" fill="#fef" stroke="#96c"/>
  <text x="1480" y="826" text-anchor="middle" font-weight="bold" font-size="11">STEAM COVER MOT</text>
  <text x="1480" y="842" text-anchor="middle" font-size="9" fill="#666">AC? confirm at bench</text>
  <line x1="1320" y1="835" x2="1410" y2="835" stroke="#d11" stroke-width="4"/>
  <path d="M1540 802 V255" stroke="#111" stroke-width="4" fill="none"/><circle cx="1540" cy="255" r="4" fill="#111"/>

  <!-- ===== NOTES ===== -->
  <g font-size="12" fill="#333">
    <text x="60" y="1006">Path per load:  acl LINE  →  SSR (term 1 → 2)  →  load  →  acn NEUTRAL.   Only the LINE leg is switched.</text>
    <text x="900" y="1006" fill="#a00">Cover motor shown as AC (4th SSR). If DC → swap for H-bridge on GPIO32/33.</text>
  </g>
</svg>
